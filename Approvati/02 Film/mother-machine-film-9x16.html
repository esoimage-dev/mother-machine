<style>
:root{--carta:#F4F2EC;--ink:#141413;--mut:#6B6A64;--ln:#D9D6CC;--f:"Hanken Grotesk",system-ui,sans-serif;--m:"DM Mono",ui-monospace,monospace;color-scheme:light}
body{background:var(--carta);color:var(--ink);font:16px/1.5 var(--f);margin:0}
.w{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:36px 80px;display:grid;gap:36px}
h1{font:700 clamp(30px,4.4vw,52px)/1 var(--f);letter-spacing:-.04em;margin:12px 0 0;text-wrap:balance}
h2{font:700 clamp(20px,2.2vw,26px)/1.1 var(--f);letter-spacing:-.03em;margin:0}
.k{font:500 12px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
header p{max-width:66ch;margin:14px 0 0}
.stage{position:relative;aspect-ratio:9/16;max-width:min(440px,100%);margin:0 auto;background:var(--carta);border:1px solid var(--ln);overflow:hidden}
.grain{position:absolute;inset:0;pointer-events:none;z-index:2}
.chap{max-width:440px;margin-inline:auto;display:flex;gap:4px;margin-top:10px}
.seg{flex:1 1 0;min-width:0;background:none;border:0;padding:8px 0 0;cursor:pointer;text-align:left;color:var(--mut);font:500 11px var(--m);letter-spacing:.08em;text-transform:uppercase;display:grid;gap:7px}
.seg i{display:block;height:3px;background:var(--ln);position:relative;overflow:hidden;transition:height .18s cubic-bezier(.33,1,.68,1)}
.seg b{position:absolute;inset:0 auto 0 0;width:0;background:#FF5B3A}
.seg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg:hover i,.seg:focus-visible i{height:6px}.seg.on{color:var(--ink)}
.seg:focus-visible{outline:2px solid #2D46E0;outline-offset:3px}
.ctl{max-width:440px;margin-inline:auto;display:flex;gap:10px;align-items:center;margin-top:14px;font:500 12px var(--m);letter-spacing:.06em;text-transform:uppercase}
.ctl button{font:inherit;letter-spacing:inherit;text-transform:inherit;background:var(--ink);color:var(--carta);border:0;border-radius:999px;height:40px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
.ctl button:focus-visible{outline:2px solid #2D46E0;outline-offset:3px}
.ctl .ic{width:40px;padding:0;justify-content:center}
.ctl button.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ctl .sn.live{background:#FF5B3A;color:var(--ink)}
.sn .eq{display:none}.sn.live .eq{display:inline-flex}.sn.live .x{display:none}.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}.eq u{width:2px;height:3px;background:currentColor;display:block}
.live .eq u{animation:eq .9s ease-in-out infinite alternate}.live .eq u:nth-child(2){animation-delay:-.3s}.live .eq u:nth-child(3){animation-delay:-.6s}
@keyframes eq{to{height:12px}}
.ctl input{width:110px;accent-color:#FF5B3A}.ctl input[hidden]{display:none}
.ctl .sp{flex:1}.ctl #tm{font-variant-numeric:tabular-nums;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.live .eq u{animation:none;height:8px}}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px}
.g>div{border-top:1.5px solid var(--ink);padding-top:12px;display:grid;gap:8px;align-content:start}
.g p{margin:0;font-size:15px;max-width:60ch}ol,ul{margin:0;padding-left:20px;font-size:15px}li{margin:6px 0}
li b{font-family:var(--m);font-weight:500;font-size:13px;margin-right:6px}
a{color:inherit}
@media (max-width:820px){.g{grid-template-columns:1fr}.seg span{font-size:9px;letter-spacing:.02em}.ctl #tm{display:none}.ctl input{width:80px}}
</style>
